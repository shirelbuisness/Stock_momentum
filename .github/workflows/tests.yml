# Runs every Strategy B test on each push and pull request. Offline only: the tests use the in-process fake
# Alpaca (strategy_b/fake_alpaca.py) and seeded synthetic markets; no secrets, no network, no broker code.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  strategy-b:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Tests
        working-directory: strategy_b
        env:
          MPLBACKEND: Agg
        run: python -m pytest -q
